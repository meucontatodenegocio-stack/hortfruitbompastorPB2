<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bom Pastor HORTIFRUTI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f3f3f3; }
    header { background: #4caf50; padding: 20px; text-align: center; }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    .categorias-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      align-items: flex-start;
      width: 100%;
      margin-bottom: 20px;
    }
    .categoria {
      background: transparent;
      text-align: center;
    }
    .titulo-categoria {
      font-size: 1.30em;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 0;
    }
    .produtos-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      align-items: center;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      width: 100%;
      max-width: 200px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .card img {
      width: auto;
      max-width: 120px;
      height: auto;
      border-radius: 12px;
      margin: 0 auto 10px auto;
      display: block;
    }
    .unidade-indicador {
      font-size: 0.97em;
      color: #4caf50;
      font-weight: bold;
      margin-bottom: 6px;
      margin-top: -2px;
      display: block;
    }
    .quantidade-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .quantidade-container button {
      background-color: #4caf50;
      border: none;
      color: white;
      padding: 5px 10px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .quantidade-container span {
      min-width: 24px;
      text-align: center;
      font-weight: bold;
    }
    button { 
      padding: 10px 15px; 
      background: #4caf50; 
      border: none; 
      color: white; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 15px;
    }
    #carrinho { 
      background: white; 
      padding: 20px; 
      border-radius: 10px; 
      margin-top: 30px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      overflow-x: auto;
    }
    #whatsappBtn { margin-top: 20px; width: 100%; font-size: 22px;padding: 18px 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; font-size: 16px; }
    td { border-bottom: 1px solid #ddd; }
    @media (max-width: 700px) {
      .container { max-width: 100%; padding: 8px; }
      .categorias-grid {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
      }
      .produtos-col { gap: 6px; }
      .card {
        max-width: none;
        min-width: 0;
        padding: 7px 3px;
        font-size: 1em;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
      }
      .titulo-categoria { font-size: 1em; }
    }
    @media (max-width: 520px) {
      .container { padding: 3px; }
      .categorias-grid {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 2px;
      }
      .card {
        padding: 6px 1px;
        font-size: 0.94em;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
      }
      .titulo-categoria { font-size: 0.98em; }
      th, td { padding: 5px; font-size: 13px; }
    }
  </style>
</head>
<body>
<header>
  <img src="Bom_Pastor_HORTIFRUTI.png" alt="Logo do Bom Pastor Hortifruti" style="max-width:220px; width:100%; display:block; margin:0 auto 10px auto; border-radius:12px;">
</header>
<div class="container">
  <h2>Produtos</h2>
  <input type="text" id="barraPesquisa" placeholder=" Buscar produto..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box;">
  <div class="categorias-grid">
    <div class="categoria">
      <div class="titulo-categoria">Legumes</div>
      <div class="produtos-col" id="catLegumes"></div>
    </div>
    <div class="categoria">
      <div class="titulo-categoria">Vegetais</div>
      <div class="produtos-col" id="catVegetais"></div>
    </div>
    <div class="categoria">
      <div class="titulo-categoria">Frutas</div>
      <div class="produtos-col" id="catFrutas"></div>
    </div>
  </div>
  <div id="carrinho">
    <h2>Carrinho</h2>
    <table id="listaCarrinho">
      <thead>
        <tr>
          <th style="text-align:left;">Item</th>
          <th style="text-align:center;">Quantidade</th>
          <th style="text-align:center;">Ação</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="whatsappBtn">Enviar pedido para o WhatsApp</button>
  </div>
</div>
<footer>
  <img src="logo-empresa.png" alt="Logo da empresa" style="max-width:200px; width:100%; border-radius:8px;">
</footer>
<script>
const produtos = [
  { nome: "Cenoura", preco: 4.20, imagem: "cenoura.jpg", categoria: "legumes", vendidoPorPeso: true, unidade: "kg" },
  { nome: "Inhame", preco: 5.20, imagem: "inhame.jpg", categoria: "legumes", vendidoPorPeso: true, unidade: "kg" },
  { nome: "Batata", preco: 3.80, imagem: "batata.jpg", categoria: "legumes", vendidoPorPeso: true, unidade: "kg" },
  { nome: "Alface", preco: 3.50, imagem: "alface.jpg", categoria: "vegetais", vendidoPorPeso: false, unidade: "unidade" },
  { nome: "Tomate", preco: 6.00, imagem: "tomate.jpg", categoria: "vegetais", vendidoPorPeso: true, unidade: "kg" },
  { nome: "Couve", preco: 2.80, imagem: "couve.jpg", categoria: "vegetais", vendidoPorPeso: false, unidade: "unidade" },
  { nome: "Maçã", preco: 5.00, imagem: "maca.jpg", categoria: "frutas", vendidoPorPeso: true, unidade: "kg" },
  { nome: "Banana", preco: 4.00, imagem: "banana.jpg", categoria: "frutas", vendidoPorPeso: true, unidade: "kg" },
  { nome: "Melão", preco: 7.50, imagem: "melao.jpg", categoria: "frutas", vendidoPorPeso: false, unidade: "unidade" },
  { nome: "Melancia", preco: 9.90, imagem: "melancia.jpg", categoria: "frutas", vendidoPorPeso: true, unidade: "kg" }
];

const listaCarrinho = document.getElementById('listaCarrinho');
const whatsappBtn = document.getElementById('whatsappBtn');
const barraPesquisa = document.getElementById('barraPesquisa');
let carrinho = {};

function renderProdutos() {
  let legumesProd = [];
  let vegetaisProd = [];
  let frutasProd = [];
  const termoPesquisa = barraPesquisa.value.toLowerCase();
  produtos
    .map((p, index) => ({ ...p, originalIndex: index }))
    .filter(p => p.nome.toLowerCase().includes(termoPesquisa))
    .forEach((p) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img loading="lazy" src="${p.imagem}" alt="${p.nome}" />
        <h3>${p.nome}</h3>
        <span class="unidade-indicador">${p.unidade ? p.unidade : ''}</span>
        <button onclick="addCarrinho(${p.originalIndex})">Adicionar</button>
      `;
      if (p.categoria === "legumes") legumesProd.push(card);
      if (p.categoria === "vegetais") vegetaisProd.push(card);
      if (p.categoria === "frutas") frutasProd.push(card);
    });
  const catLegumes = document.getElementById('catLegumes');
  const catVegetais = document.getElementById('catVegetais');
  const catFrutas = document.getElementById('catFrutas');
  catLegumes.innerHTML = '';
  catVegetais.innerHTML = '';
  catFrutas.innerHTML = '';
  legumesProd.forEach(e => catLegumes.appendChild(e));
  vegetaisProd.forEach(e => catVegetais.appendChild(e));
  frutasProd.forEach(e => catFrutas.appendChild(e));
}

function addCarrinho(index) {
  const produto = produtos[index];
  const nomeBusca = produto.nome;
  if (carrinho[nomeBusca]) {
    carrinho[nomeBusca].quantidade++;
  } else {
    carrinho[nomeBusca] = { ...produto, quantidade: 1 };
  }
  atualizarCarrinho();
}

function alterarQuantidade(nome, delta) {
  if (carrinho[nome]) {
    const novaQtd = carrinho[nome].quantidade + delta;
    if (novaQtd >= 1) {
      carrinho[nome].quantidade = novaQtd;
      atualizarCarrinho();
    }
  }
}

function removerItem(nome) {
  if (carrinho[nome]) {
    delete carrinho[nome];
    atualizarCarrinho();
  }
}

function atualizarCarrinho() {
  const tabela = document.querySelector('#listaCarrinho tbody');
  tabela.innerHTML = '';
  Object.values(carrinho).forEach((item) => {
    const nomeExibicao = `${item.nome} (${item.unidade || ''})`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${nomeExibicao}</td>
      <td>
        <div class="quantidade-container">
          <button onclick="alterarQuantidade('${item.nome}', -1)">−</button>
          <span>${item.quantidade}</span>
          <button onclick="alterarQuantidade('${item.nome}', 1)">+</button>
        </div>
      </td>
      <td>
        <button onclick="removerItem('${item.nome}')" style='padding:5px 8px;font-size:12px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer;'>X</button>
      </td>
    `;
    tabela.appendChild(tr);
  });
}

whatsappBtn.addEventListener('click', () => {
  if (Object.keys(carrinho).length === 0) {
    alert('Carrinho está vazio!');
    return;
  }
  let mensagem = 'Olá, gostaria de fazer um pedido:\n\n';
  Object.values(carrinho).forEach((item) => {
    mensagem += `- ${item.nome} (${item.unidade || ''}) (x${item.quantidade})\n`;
  });
  const numero = '5522992905633';
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
  window.open(url, '_blank');
});

barraPesquisa.addEventListener('input', renderProdutos);
renderProdutos();
</script>
</body>
</html>
